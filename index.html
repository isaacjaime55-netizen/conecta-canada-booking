<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Call — Conecta Canada</title>
  <meta name="description" content="Book a call with Conecta Canada and learn your options to study in Canada.">
  <meta property="og:title" content="Book a Call — Conecta Canada">
  <meta property="og:description" content="Pick a time that works for you and we will walk you through your options to study in Canada.">
  <meta property="og:image" content="/og-image.jpg">
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#f6f5f3;color:#1f1f1f;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:#d52b1e}a:hover{color:#a81f15}
    .page{min-height:100vh;display:flex;flex-direction:column}
    header{background:#1f1f1f;color:#f3f1ec;padding:0 20px}
    .bar{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
    .bar img{height:44px;width:auto;display:block}
    .lang{display:flex;gap:4px;background:#2c2c2c;border-radius:999px;padding:4px}
    .lang button{border:0;cursor:pointer;font:600 13px 'DM Sans',sans-serif;letter-spacing:.04em;padding:8px 14px;border-radius:999px;min-height:36px;background:transparent;color:#bdb9b1}
    .lang button[aria-pressed="true"]{background:#e3261b;color:#fff}
    .hero{background:#1f1f1f;color:#f3f1ec;padding:40px 20px 120px}
    .hero-inner{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
    .eyebrow{display:flex;align-items:center;gap:10px;font:600 12px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#ff5a4d}
    .eyebrow::before{content:"";width:24px;height:2px;background:#e3261b}
    h1{margin:0;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:clamp(44px,10vw,88px);line-height:.95;letter-spacing:.01em}
    .sub{margin:0;max-width:520px;font-size:17px;line-height:1.55;color:#c9c6bf;text-wrap:pretty}
    main{padding:0 12px;margin-top:-88px;flex:1}
    .card{max-width:960px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.25);overflow:hidden}
    .card::before{content:"";display:block;height:4px;background:#e3261b}
    #calendar-embed{min-height:640px;padding:8px 0}
    #calendar-embed iframe{width:100%;height:1250px;min-height:1250px;border:none;display:block}
    footer{padding:32px 20px;text-align:center;font-size:13px;color:#7a766e}
  </style>
</head>
<body>
<div class="page">
  <header>
    <div class="bar">
      <a href="https://conecta-canada.vercel.app/"><img src="/logo.png" alt="Conecta Canada"></a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div class="eyebrow" data-i18n="eyebrow">Book a call</div>
      <h1 data-i18n="title">Study Abroad</h1>
      <p class="sub" data-i18n="sub">Pick a time that works for you and we will walk you through your options to study in Canada.</p>
    </div>
  </section>

  <main>
    <div class="card">
      <div id="calendar-embed">
        <iframe src="https://api.leadconnectorhq.com/widget/booking/JotVrJqkrQsfzBg8Tra9" allow="payment" scrolling="yes" id="JotVrJqkrQsfzBg8Tra9_1792019003420" title="Booking calendar"></iframe>
      </div>
    </div>
  </main>

  <footer>© 2026 Conecta Canada</footer>
</div>

<script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>
<script>
  (function () {
    var copy = {
      en: { eyebrow: 'Book a call', title: 'Study Abroad', sub: 'Pick a time that works for you and we will walk you through your options to study in Canada.' },
      es: { eyebrow: 'Agenda una llamada', title: 'Estudia en el extranjero', sub: 'Elige el horario que mejor te funcione y te explicaremos tus opciones para estudiar en Canadá.' }
    };
    var buttons = document.querySelectorAll('.lang button');
    function setLang(lang) {
      var t = copy[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t[el.getAttribute('data-i18n')]; });
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
      try { localStorage.setItem('cc-lang', lang); } catch (e) {}
    }
    buttons.forEach(function (b) { b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); }); });
    var saved = null;
    try { saved = localStorage.getItem('cc-lang'); } catch (e) {}
    var initial = new URLSearchParams(location.search).get('lang') || saved || ((navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en');
    setLang(copy[initial] ? initial : 'en');
  })();
</script>
</body>
</html>
